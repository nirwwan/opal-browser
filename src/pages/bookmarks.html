<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bookmarks</title>
  <link rel="stylesheet" href="pages.css">
  <style>
    .layout { display: grid; grid-template-columns: 220px 1fr; gap: 28px; }
    .side { position: sticky; top: 24px; align-self: start; }
    .side button { display: flex; align-items: center; gap: 10px; width: 100%; height: 32px; padding: 0 10px; border: 0; background: none; border-radius: var(--r-btn); text-align: left; color: var(--body); }
    .side button:hover { background: var(--hover); }
    .side button.sel { background: var(--hover); color: var(--text); font-weight: 500; }
    .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
    .crumbs { color: var(--text-2); margin-bottom: 10px; display: flex; gap: 6px; align-items: center; }
    .crumbs a { cursor: pointer; }
    .b-row { display: flex; align-items: center; gap: 12px; padding: 9px 14px; border-bottom: 1px solid var(--hair); }
    .b-row:last-child { border-bottom: 0; }
    .b-row .ic { color: var(--text-2); }
    .b-row .t { color: var(--text); }
    .b-row .u { color: var(--text-2); font-size: 12px; }
    .b-row .main { flex: 1; min-width: 0; cursor: pointer; }
    .b-row.editing { flex-wrap: wrap; background: #fafbfc; }
    .b-row.editing .field { flex: 1; min-width: 180px; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
    #q { flex: 1; }
    select.field { padding-right: 24px; }
  </style>
</head>
<body>
  <div class="wrap" style="max-width: 1040px">
    <div class="page-head"><h1>Bookmarks</h1></div>
    <div class="layout">
      <nav class="side" id="side" aria-label="Spaces and folders"></nav>
      <section>
        <div class="toolbar">
          <input class="field" id="q" type="search" placeholder="Search all bookmarks">
          <button class="btn" id="add-bm">Add bookmark</button>
          <button class="btn" id="add-folder">Add folder</button>
        </div>
        <div class="crumbs" id="crumbs"></div>
        <div class="card" id="list"></div>
      </section>
    </div>
  </div>
  <script src="icons.js"></script>
  <script src="bookmarks.js"></script>
</body>
</html>
