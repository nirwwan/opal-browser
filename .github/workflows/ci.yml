name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: System packages for Electron under Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libnss3 libgbm1 libasound2t64 libgtk-3-0t64 libxss1 libxtst6 libsecret-1-0

      - run: npm ci

      # Ubuntu 24.04 restricts unprivileged user namespaces, so Chromium needs its setuid helper.
      - name: Enable Electron's sandbox helper
        run: sudo chown root:root node_modules/electron/dist/chrome-sandbox && sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Playwright tests (Electron, headless with Xvfb)
        run: npm run test:e2e

      - name: Keep test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
